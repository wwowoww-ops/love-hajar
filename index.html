<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى هاجر</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section class="intro" id="intro">

            <div class="card">

                <div class="small-title">إلى هاجر</div>

                <h1>عندي لك شيء صغير</h1>

                <p>هذه المرة لن نلعب شطرنجا عاديا</p>
                <p>كل قطعة تحمل شيئا يذكرني بك</p>

                <button id="startBtn">
                    ابدئي
                </button>

            </div>

        </section>


        <section class="game hidden" id="game">

            <h2>رقعتنا</h2>

            <p class="hint">
                اضغطي على القطع
            </p>

            <div class="board" id="board"></div>

            <div class="message-box">

                <div id="pieceName">
                    اختاري قطعة
                </div>

                <p id="message">
                    كل قطعة هنا لها معنى خاص
                </p>

            </div>

        </section>


        <section class="ending hidden" id="ending">

            <div class="card">

                <div class="checkmate">
                    كش مات
                </div>

                <h1>انتهت اللعبة</h1>

                <p>
                    في النهاية اكتشفت شيئا
                </p>

                <p>
                    لم تكن القطع هي الشيء المهم
                </p>

                <p>
                    كان المهم الشخص الذي جعلني أراها بطريقة مختلفة
                </p>

                <p class="final">
                    هاجر
                </p>

                <div class="heart">♥</div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
